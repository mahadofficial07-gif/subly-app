workflows:
  android-release:
    name: Subly Android Build
    max_build_duration: 60
    environment:
      flutter: stable
      # No android_signing yet — this build uses Flutter's default debug
      # signing so you can test-install it on your own phone. Before
      # submitting to the Play Store, generate a real release keystore
      # and add it back here (see SETUP_GUIDE.md for that step).
    scripts:
      - name: Generate Android/iOS platform files
        script: |
          # This project only contains Dart source (lib/) and pubspec.yaml.
          # flutter create fills in the missing android/, ios/ etc. folders
          # without touching existing lib/ files.
          flutter create . --platforms=android --org com.example.subly

      - name: Add required Android permissions
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Insert permissions required for notifications + billing,
          # right after the opening <manifest ...> tag.
          sed -i '0,/<manifest /{s//<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /}' "$MANIFEST" || true
          awk '
            /<manifest/ && !done {
              print;
              print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>";
              print "    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>";
              print "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>";
              print "    <uses-permission android:name=\"com.android.vending.BILLING\"/>";
              done=1;
              next
            }
            { print }
          ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          cat "$MANIFEST"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Enable core library desugaring
        script: |
          python3 - <<'PY'
          import re, os

          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          path = kts if os.path.exists(kts) else groovy

          with open(path) as f:
              content = f.read()

          if path.endswith('.kts'):
              if 'isCoreLibraryDesugaringEnabled' not in content:
                  content = re.sub(r'(compileOptions\s*\{)',
                                    r'\1\n        isCoreLibraryDesugaringEnabled = true',
                                    content, count=1)
              if 'coreLibraryDesugaring(' not in content:
                  content = re.sub(r'(\ndependencies\s*\{)',
                                    r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                                    content, count=1)
          else:
              if 'coreLibraryDesugaringEnabled' not in content:
                  content = re.sub(r'(compileOptions\s*\{)',
                                    r'\1\n        coreLibraryDesugaringEnabled true',
                                    content, count=1)
              if "coreLibraryDesugaring '" not in content and 'coreLibraryDesugaring(' not in content:
                  content = re.sub(r'(\ndependencies\s*\{)',
                                    r"\1\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                                    content, count=1)

          with open(path, 'w') as f:
              f.write(content)

          print('Patched', path)
          print(content)
          PY

      - name: Build release APK (for sideloading on your own phone to test)
        script: flutter build apk --release

      - name: Build release App Bundle (for Play Store upload)
        script: flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - android/app/src/main/AndroidManifest.xml

    publishing:
      email:
        recipients:
          - mahad.official.07@gmail.com
        notify:
          success: true
          failure: true
