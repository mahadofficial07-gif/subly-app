name: subly
description: "Track your subscriptions and never get surprised by a renewal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  csv: ^6.0.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
